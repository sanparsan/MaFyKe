# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: MaFyKe
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: null
  locale: "sv-SE"
  baseUrl: "sanparsan.github.io/MaFyKe"
  ignorePatterns:
    - private
    - templates
    - ".obsidian"
  defaultDateType: created
  generateSocialImages: false
  theme:
    fontOrigin: googleFonts
    cdnHosted: true
    typography:
      header: "Inter"
      body: "Inter"
      code: "Fira Code"
    colors:
      lightMode:
        light: "#eff1f5"
        lightgray: "#e6e9ef"
        gray: "#bcc0cc"
        darkgray: "#4c4f69"
        dark: "#202231"
        secondary: "#1e66f5"
        tertiary: "#ea76cb"
        highlight: "rgba(30, 102, 245, 0.15)"
        textHighlight: "#40a02b88"
      darkMode:
        light: "#24273a"
        lightgray: "#363a4f"
        gray: "#5b6078"
        darkgray: "#cad3f5"
        dark: "#b8c0e0"
        secondary: "#8aadf4"
        tertiary: "#f5a97f"
        highlight: "rgba(138, 173, 244, 0.15)"
        textHighlight: "#b3f6c088"
plugins:
  transformers:
    - Plugin.Frontmatter()
    - Plugin.CreatedModifiedDate({ priority: ["frontmatter", "filesystem"] })
    - Plugin.SyntaxHighlighting({
        theme: {
          light: "github-light",
          dark: "github-dark",
        },
        keepBackground: false,
      })
    - Plugin.ObsidianFlavoredMarkdown({ enableInpageHeaders: true })
    - Plugin.GitHubFlavoredMarkdown()
    - Plugin.TableOfContents()
    - Plugin.CrawlLinks({ markdownLinkResolution: "shortest" })
    - Plugin.Description()
    - Plugin.Latex({ renderEngine: "katex" })
  filters:
    - Plugin.RemoveDrafts()
  emitters:
    - Plugin.AliasRedirects()
    - Plugin.ComponentResources()
    - Plugin.ContentPage()
    - Plugin.FolderPage()
    - Plugin.TagPage()
    - Plugin.ContentIndex({
        enableSiteMap: true,
        enableRSS: true,
      })
    - Plugin.Assets()
    - Plugin.Static()
    - Plugin.NotFoundPage()